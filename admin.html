<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"><title>مدیریت بوتیک GHΛZ</title><link rel="stylesheet" href="css/style.css"></head><body><div class="announcement">GHΛZ / FASHION HOUSE — پنل مدیریت</div><main class="adm">
<section id="setup" class="panel login" hidden><h2>ساخت رمز مدیریت</h2><p class="muted">برای اولین ورود، یک رمز قوی حداقل ۸ کاراکتری بساز.</p><form id="setupForm"><label>رمز جدید<input name="p" type="password" minlength="8" required></label><p id="setupMsg" class="msg"></p><button class="btn dark">ساخت پنل</button></form></section>
<section id="login" class="panel login" hidden><h2>ورود مدیر</h2><form id="loginForm"><label>رمز عبور<input name="p" type="password" required></label><p id="loginMsg" class="msg"></p><button class="btn dark">ورود</button></form></section>
<section id="panel" hidden><div class="tools"><div><span class="eyebrow">GHΛZ / CONTROL CENTER</span><h1>مدیریت فروشگاه</h1></div><div><button class="btn dark" id="exportBtn">ذخیره و دانلود shop.json</button> <button class="btn sec" id="logoutBtn">خروج</button></div></div>
<div class="panel"><h2>تنظیمات فروشگاه</h2><form id="settingsForm" class="two"><label>نام فروشگاه<input name="shop" required></label><label>شماره واتساپ (با کد کشور)<input name="phone" required></label><label class="full">معرفی کوتاه<textarea name="intro" rows="2"></textarea></label><label class="full">تغییر رمز مدیر (اختیاری)<input name="newPass" type="password" minlength="8"></label><button class="btn dark full">ثبت تنظیمات</button></form></div>
<div class="panel"><h2 id="pFormTitle">افزودن محصول پوشاک</h2><form id="pForm" class="two"><input name="id" type="hidden"><label>نام محصول<input name="name" required></label><label>برند / کالکشن<input name="brand"></label><label>دسته‌بندی<select name="cat" required><option value="women">زنانه</option><option value="men">مردانه</option><option value="kids">بچگانه</option><option value="shoes">کفش</option><option value="bags">کیف و اکسسوری</option></select></label><label>قیمت (تومان)<input name="price" type="number" min="0" required></label><label>قیمت قبل تخفیف<input name="oldPrice" type="number" min="0"></label><label>موجودی<input name="stock" type="number" min="0" required></label><label>لینک عکس HTTPS<input name="img" type="url" placeholder="https://..."></label><label>سایزها (با کاما جدا کن)<input name="sizes" placeholder="S, M, L, XL یا ۳۸، ۳۹"></label><label>رنگ‌ها (با کاما جدا کن)<input name="colors" placeholder="مشکی، سفید، کرم"></label><label class="full">توضیحات<textarea name="desc" rows="2"></textarea></label><button class="btn dark">ذخیره محصول</button><button class="btn sec" type="button" id="pReset">پاک کردن فرم</button></form></div>
<div class="panel"><h2>محصولات ثبت‌شده</h2><div style="overflow:auto"><table><thead><tr><th>محصول</th><th>قیمت</th><th>موجودی</th><th>عملیات</th></tr></thead><tbody id="pTable"></tbody></table></div></div></section><div class="toast" id="toast" hidden></div></main><script src="js/admin.js" defer></script></body></html>
